name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare published environment
        env:
          PUBLISHED_CONFIG_JSON: ${{ vars.PUBLISHED_CONFIG_JSON }}
        run: |
          if [ -n "$PUBLISHED_CONFIG_JSON" ]; then
            mkdir -p src/environments/published
            printf '%s' "$PUBLISHED_CONFIG_JSON" > src/environments/published/config.json
            node -e "JSON.parse(require('node:fs').readFileSync('src/environments/published/config.json', 'utf8'))"
          fi

      - name: Build published artifact
        env:
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
          PAGES_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: |
          export BASE_PATH="${PAGES_BASE_PATH:-/${{ github.event.repository.name }}/}"
          npm run build:published
          if [ -n "$PAGES_CUSTOM_DOMAIN" ]; then
            printf '%s' "$PAGES_CUSTOM_DOMAIN" > published/CNAME
          fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: published

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
