name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare published environment
        env:
          PUBLISHED_CONFIG_JSON: ${{ vars.PUBLISHED_CONFIG_JSON }}
        run: |
          if [ -n "$PUBLISHED_CONFIG_JSON" ]; then
            mkdir -p src/environments/published
            printf '%s' "$PUBLISHED_CONFIG_JSON" > src/environments/published/config.json
            node -e "JSON.parse(require('node:fs').readFileSync('src/environments/published/config.json', 'utf8'))"
          fi

      - name: Build published artifact
        env:
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
          PAGES_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: |
          export BASE_PATH="${PAGES_BASE_PATH:-/${{ github.event.repository.name }}/}"
          npm run build:published
          if [ -n "$PAGES_CUSTOM_DOMAIN" ]; then
            printf '%s' "$PAGES_CUSTOM_DOMAIN" > published/CNAME
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: published

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
